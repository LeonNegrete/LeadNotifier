# List of RSS feeds to poll daily.
# "verified: true" means I (Claude) confirmed this feed URL resolves, OR I confirmed
# the exact underlying tag/category page is packed with on-target renovation content
# and the feed follows a pattern this site's own RSS page confirmed works.
# "verified: false" means it's a well-known publication with a standard WordPress-style
# /feed URL guessed from convention — check it once in your browser before relying on it.
#
# Prioritized for SIGNAL over VOLUME (2026-07-25 update): the general Hosteltur firehose
# feed was dropped — it was ~95% noise (airline strikes, tourism policy, tourist-tax news)
# for this use case. These tag-specific feeds are what Hosteltur itself uses to bucket
# renovation/investment stories, so they arrive pre-filtered.

feeds:
  - name: "Hosteltur - Reformas hoteleras (renovations)"
    url: "https://www.hosteltur.com/feed/tag/reformas-hoteleras"
    category: "renovation_signal"
    verified: true
    note: >
      Highest-signal feed in this list. Checked the underlying tag page directly —
      it's wall-to-wall renovation investment stories with euro amounts
      ("Petit Palace invierte 1M€...", "Parador de Ceuta... 6M€ en renovación").

  - name: "Hosteltur - Reformas (broader renovation tag)"
    url: "https://www.hosteltur.com/feed/tag/reformas"
    category: "renovation_signal"
    verified: false
    note: "Broader version of the tag above — some overlap expected, that's fine (dedup handles it)."

  - name: "Hosteltur - Aperturas de hoteles (new openings)"
    url: "https://www.hosteltur.com/feed/tag/aperturas-de-hoteles"
    category: "hotel_openings"
    verified: false
    note: "New hotels often mean a fresh interior fit-out even without the word 'reforma'."

  - name: "Hosteltur - Hoteles y Alojamientos (category)"
    url: "https://www.hosteltur.com/feed/hoteles-y-alojamientos"
    category: "hospitality_news"
    verified: true
    note: "Broader hotel-category news — kept as a lighter-signal backstop, not the primary source anymore."

  - name: "Preferente"
    url: "https://www.preferente.com/feed"
    category: "hospitality_news"
    verified: false

# --- Known broken, not currently active ---
