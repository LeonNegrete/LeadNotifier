# --- Recommended manual addition: Google Alerts (free, keyword-targeted, ~2 min setup) ---
# Google Alerts still supports RSS delivery, but it's a manual per-keyword setup (no
# guessable URL — has to be created in your own Google account):
#   1. Go to https://www.google.com/alerts
#   2. Create an alert for a specific phrase, e.g. "reforma hotel" OR "video wall hotel"
#      (try a few phrasings — narrower alerts give cleaner results than one broad one)
#   3. Click "Show options" → set "Sources" to News/Blogs, "Region" to Spain
#   4. Set "Deliver to" to "RSS feed" (not email)
#   5. Save, then find the alert in "My Alerts" and copy its RSS feed URL
#   6. Add it here as a new feed entry
# This is worth doing — it's free, catches sources outside this curated list entirely,
# and you control the exact keywords.

