# List of RSS feeds to poll daily.
# "verified: true" means I (Claude) confirmed this feed URL resolves, OR I confirmed
# the exact underlying tag/category page is packed with on-target renovation content
# and the feed follows a pattern this site's own RSS page confirmed works.
# "verified: false" means it's a well-known publication with a standard WordPress-style
# /feed URL guessed from convention — check it once in your browser before relying on it.
#
# Prioritized for SIGNAL over VOLUME. Lesson learned 2026-07-26: a broad topically-adjacent
# feed (Cruise Hive) generated 15/24 articles in one run but only 2 were even remotely
# relevant, and both got correctly filtered out anyway. Prefer narrow, purpose-built tag/
# category feeds over general publications, even within a relevant industry.
#
# 2026-07-26: cruise ship scope was dropped entirely (decided not worth pursuing as a
# market) — Cruise Industry News and Cruise Hive removed accordingly. Added Experimenta's
# interiorismo section instead, which directly names hotel renovation projects + the
# design studios behind them.
#
# 2026-07-27: added Hosteltur's "tecnología hotelera" tag to catch large-format/unusual
# screen installations (video walls, curved screens, screen arrays) per new business
# scope — these now qualify as leads even without a broader renovation. Checked a live
# example from this tag: a Madrid Marriott piece describing 900+ LG 4K TVs, a lobby
# video wall, and mirror-integrated displays. Other AV/digital-signage trade press
# (rAVe, Inavate, Digital Signage Today) was checked and rejected — mostly US/UK vendor
# product-launch news, wrong geography, low relevance.
#
# Daily capacity note: confirmed live limit for the pinned Gemini model is 500 requests/day
# (see README). Recent runs have averaged ~28/day (max 37) even with a growing feed list —
# huge headroom. The constraint on adding more feeds is SIGNAL QUALITY, not quota.

feeds:
  - name: "Hosteltur - Reformas hoteleras (renovations)"
    url: "https://www.hosteltur.com/feed/tag/reformas-hoteleras"
    category: "renovation_signal"
    verified: true
    note: >
      Highest-signal feed in this list. Checked the underlying tag page directly —
      it's wall-to-wall renovation investment stories with euro amounts
      ("Petit Palace invierte 1M€...", "Parador de Ceuta... 6M€ en renovación").

  - name: "Hosteltur - Reformas (broader renovation tag)"
    url: "https://www.hosteltur.com/feed/tag/reformas"
    category: "renovation_signal"
    verified: false
    note: "Broader version of the tag above — some overlap expected, that's fine (dedup handles it)."

  - name: "Hosteltur - Interiorismo"
    url: "https://www.hosteltur.com/feed/tag/interiorismo"
    category: "renovation_signal"
    verified: false
    note: >
      Confirmed this tag exists and is actively used (checked hosteltur.com/tag/interiorismo) —
      covers interior design studios, hotel design trends, and named projects directly.
      Same /feed/tag/<slug> pattern as the verified reformas-hoteleras feed above.

  - name: "Hosteltur - Tecnología hotelera (screens/AV)"
    url: "https://www.hosteltur.com/feed/tag/tecnologia-hotelera"
    category: "screen_signal"
    verified: false
    note: >
      Added for the screen-installation lead type. Checked the underlying tag directly —
      found a live example (Madrid Marriott: 900+ LG 4K TVs, lobby video wall, mirror-
      integrated displays) that's exactly on-target. Same /feed/tag/<slug> pattern as the
      other verified Hosteltur tag feeds. Will also carry general hotel-tech noise (WiFi,
      check-in kiosks, PMS software) that isn't screen-relevant — the classifier prompt
      filters that out, this feed just needs to get the signal in front of it.

  - name: "Hosteltur - Aperturas de hoteles (new openings)"
    url: "https://www.hosteltur.com/feed/tag/aperturas-de-hoteles"
    category: "hotel_openings"
    verified: false
    note: "New hotels often mean a fresh interior fit-out even without the word 'reforma'."

  - name: "Hosteltur - Hoteles y Alojamientos (category)"
    url: "https://www.hosteltur.com/feed/hoteles-y-alojamientos"
    category: "hospitality_news"
    verified: true
    note: "Broader hotel-category news — kept as a lighter-signal backstop, not the primary source anymore."

  - name: "Brains Real Estate News - Hoteles"
    url: "https://brainsre.news/category/hoteles/feed/"
    category: "investment_signal"
    verified: false
    note: >
      Strong candidate, worth checking first. Spanish hotel real-estate outlet — checked
      the category page directly and it's dense with hotel openings, sales, and office/
      residential-to-hotel conversions (e.g. tracked one report on a 430M€ resort sale
      and a running list of confirmed 2026 hotel openings with per-project investment
      figures). Conversions and acquisitions are an earlier signal than "reforma" news:
      that money typically leads to an interior fit-out within 12-24 months. URL is a
      standard WordPress category-feed guess — verify before relying on it.

  - name: "Experimenta - Interiorismo"
    url: "https://www.experimenta.es/noticias/interiorismo/feed/"
    category: "renovation_signal"
    verified: false
    note: >
      Spanish design magazine (est. 1988) — checked the interiorismo section directly and
      it names both the hotel and the design studio in its hotel-renovation coverage
      (e.g. a Hotel Barceló Málaga lobby redesign, naming studio Ilmiodesign). The general
      magazine also covers non-hospitality design (graphic, product) — this URL is scoped
      to just the interiorismo section to avoid that noise. Standard WP category-feed
      guess, verify before relying on it.

  - name: "Preferente"
    url: "https://www.preferente.com/feed"
    category: "hospitality_news"
    verified: false

