# List of RSS feeds to poll daily.
# "verified: true" means I (Claude) confirmed this feed URL resolves and is a real feed.
# "verified: false" means it's a well-known publication with a standard WordPress-style
# /feed URL guessed from convention — check it once in your browser before relying on it.
#
# Add/remove feeds freely. Category is just a label for you; it isn't used by the code yet.

feeds:
  - name: "Hosteltur - General"
    url: "https://www.hosteltur.com/feed"
    category: "hospitality_news"
    verified: true

  - name: "Hosteltur - Hoteles y Alojamientos"
    url: "https://www.hosteltur.com/feed/hoteles-y-alojamientos"
    category: "hospitality_news"
    verified: true

  - name: "TecnoHotel"
    url: "https://tecnohotelnews.com/feed"
    category: "hospitality_trade"
    verified: false

  - name: "Preferente"
    url: "https://www.preferente.com/feed"
    category: "hospitality_news"
    verified: false

  - name: "Hosteltur - Tag Aperturas de Hoteles"
    url: "https://www.hosteltur.com/feed/tag/aperturas-de-hoteles"
    category: "hotel_openings"
    verified: false

