# List of RSS feeds to poll daily.
# "verified: true" means I (Claude) confirmed this feed URL resolves, OR I confirmed
# the exact underlying tag/category page is packed with on-target renovation content
# and the feed follows a pattern this site's own RSS page confirmed works.
# "verified: false" means it's a well-known publication with a standard WordPress-style
# /feed URL guessed from convention — check it once in your browser before relying on it.
#
# Prioritized for SIGNAL over VOLUME (2026-07-25 update): the general Hosteltur firehose
# feed was dropped — it was ~95% noise (airline strikes, tourism policy, tourist-tax news)
# for this use case. These tag-specific feeds are what Hosteltur itself uses to bucket
# renovation/investment stories, so they arrive pre-filtered.
#
# 2026-07-26 update: added Hosteltur's interiorismo tag, and two new categories of
# source entirely — real-estate/investment press (brainsre.news, arguably the single
# best-fit source found: it covers hotel *conversions* and acquisitions, which is an
# even earlier and stronger signal of upcoming interior spend than "reforma" news) and
# cruise trade press (now in scope since the classifier covers ships too).

feeds:
  - name: "Hosteltur - Reformas hoteleras (renovations)"
    url: "https://www.hosteltur.com/feed/tag/reformas-hoteleras"
    category: "renovation_signal"
    verified: true
    note: >
      Highest-signal feed in this list. Checked the underlying tag page directly —
      it's wall-to-wall renovation investment stories with euro amounts
      ("Petit Palace invierte 1M€...", "Parador de Ceuta... 6M€ en renovación").

  - name: "Hosteltur - Reformas (broader renovation tag)"
    url: "https://www.hosteltur.com/feed/tag/reformas"
    category: "renovation_signal"
    verified: false
    note: "Broader version of the tag above — some overlap expected, that's fine (dedup handles it)."

  - name: "Hosteltur - Interiorismo"
    url: "https://www.hosteltur.com/feed/tag/interiorismo"
    category: "renovation_signal"
    verified: false
    note: >
      Confirmed this tag exists and is actively used (checked hosteltur.com/tag/interiorismo) —
      covers interior design studios, hotel design trends, and named projects directly.
      Same /feed/tag/<slug> pattern as the verified reformas-hoteleras feed above.

  - name: "Hosteltur - Aperturas de hoteles (new openings)"
    url: "https://www.hosteltur.com/feed/tag/aperturas-de-hoteles"
    category: "hotel_openings"
    verified: false
    note: "New hotels often mean a fresh interior fit-out even without the word 'reforma'."

  - name: "Hosteltur - Hoteles y Alojamientos (category)"
    url: "https://www.hosteltur.com/feed/hoteles-y-alojamientos"
    category: "hospitality_news"
    verified: true
    note: "Broader hotel-category news — kept as a lighter-signal backstop, not the primary source anymore."

  - name: "Brains Real Estate News - Hoteles"
    url: "https://brainsre.news/category/hoteles/feed/"
    category: "investment_signal"
    verified: false
    note: >
      Strong candidate, worth checking first. Spanish hotel real-estate outlet — checked
      the category page directly and it's dense with hotel openings, sales, and office/
      residential-to-hotel conversions (e.g. tracked one report on a 430M€ resort sale
      and a running list of confirmed 2026 hotel openings with per-project investment
      figures). Conversions and acquisitions are an earlier signal than "reforma" news:
      that money typically leads to an interior fit-out within 12-24 months. URL is a
      standard WordPress category-feed guess — verify before relying on it.

  - name: "Preferente"
    url: "https://www.preferente.com/feed"
    category: "hospitality_news"
    verified: false

  - name: "Cruise Industry News"
    url: "https://cruiseindustrynews.com/feed"
    category: "cruise_signal"
    verified: false
    note: >
      Trade press specifically for cruise line executives, shipyards, and ship designers —
      covers newbuilds and refits directly, per their own "About" page. Best-fit cruise
      source found. URL is a standard WordPress /feed guess — verify before relying on it.

  - name: "Cruise Hive"
    url: "https://www.cruisehive.com/feed"
    category: "cruise_signal"
    verified: true
    note: "More consumer-facing than Cruise Industry News, but confirmed feed URL and does cover refit/refurbishment announcements."

# --- Known broken, not currently active ---
# TecnoHotel (tecnohotelnews.com/feed) — their WordPress feed has been returning
# malformed XML (unescaped characters breaking the parser) as of 2026-07. Worth
# re-checking periodically since this may just be a temporary bug on their end,
# but not worth troubleshooting further right now given the Hosteltur tag feeds
# above are more targeted anyway.

